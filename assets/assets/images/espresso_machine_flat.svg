  <rect x="55" y="248" width="290" height="44" rx="10" fill="#806D61"/>
  <rect x="70" y="200" width="260" height="22" rx="4" fill="#2A2A2A"/>
  <rect x="95" y="48" width="210" height="155" rx="18" fill="#5A3825"/>
